<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Monitoring Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 min-h-screen p-4 md:p-6 transition-colors duration-300">

    <!-- Header -->
    <header class="mb-6 flex flex-wrap justify-between items-center gap-4 bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 transition-colors duration-300">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Server Monitoring Dashboard</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400">Real-time metrics, threshold alerts, and process drill-down</p>
        </div>

        <div class="flex flex-wrap items-center gap-3">
            <button onclick="toggleTheme()" title="Toggle Theme" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
                <svg id="themeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
            </button>

            <a href="/devices" class="px-3.5 py-2 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 hover:bg-blue-100 dark:hover:bg-blue-900/50 rounded-lg text-sm font-semibold transition-colors">
                Devices
            </a>
            <a href="/history" class="px-3.5 py-2 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 dark:hover:bg-indigo-900/50 rounded-lg text-sm font-semibold transition-colors">
                History
            </a>
            <button onclick="openSettingsModal()" class="px-3.5 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-lg text-sm font-semibold transition-colors">
                Settings
            </button>
            <a href="/logout" class="px-3.5 py-2 bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 hover:bg-red-100 dark:hover:bg-red-900/50 rounded-lg text-sm font-semibold transition-colors">
                Logout
            </a>

            <div class="flex items-center gap-2">
                <label for="serverSelect" class="text-sm font-semibold text-slate-600 dark:text-slate-300">Server:</label>
                <select id="serverSelect" onchange="onServerChange()" class="bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-900 dark:text-white text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2 transition-colors">
                    {% for s in servers %}
                    <option value="{{ s.id }}">{{ s.hostname }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Dynamic Server Status Badge (10s Heartbeat Check) -->
            <span id="statusBadge" class="flex items-center gap-2 text-sm font-semibold text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-700 px-3 py-1 rounded-full transition-colors">
                <span id="statusDot" class="w-2 h-2 rounded-full bg-slate-400 dark:bg-slate-500"></span>
                <span id="statusText">Offline</span>
            </span>
        </div>
    </header>

    <!-- Global Threshold Alert Banner -->
    <div id="alertBanner" class="hidden mb-6 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 px-4 py-3 rounded-xl flex items-center gap-3 shadow-sm">
        <svg class="w-5 h-5 text-red-600 dark:text-red-400 shrink-0 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
        <span class="font-bold text-sm">ALERT:</span>
        <span id="alertMessage" class="text-sm font-medium"></span>
    </div>

    <!-- Main Charts Layout -->
    <div class="flex flex-col gap-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 transition-colors duration-300 lg:col-span-2">
                <h2 class="text-lg font-semibold mb-4 dark:text-white">Real-time Load Trend</h2>
                <div id="lineChart" class="w-full h-[350px]"></div>
            </div>

            <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 transition-colors duration-300">
                <h2 class="text-lg font-semibold mb-4 dark:text-white">Current RAM Usage</h2>
                <div id="pieChart" class="w-full h-[350px]"></div>
            </div>
        </div>

        <!-- Bar Chart with Drill-Down -->
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 transition-colors duration-300">
            <div class="flex justify-between items-center mb-4">
                <h2 id="drillDownTitle" class="text-lg font-semibold dark:text-white">Server CPU Load (Click a column to Drill-down)</h2>
                <button id="backBtn" onclick="goBackToLevel1()" class="hidden px-4 py-2 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-100 dark:hover:bg-indigo-900/50 rounded-lg text-sm font-semibold transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Back to Servers
                </button>
            </div>
            <div id="barChart" class="w-full h-[400px]"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-xl shadow-xl border border-slate-100 dark:border-slate-700 p-6">
            <div class="flex justify-between items-center mb-4 border-b border-slate-100 dark:border-slate-700 pb-3">
                <h2 class="text-lg font-bold text-slate-900 dark:text-white">Alert Settings</h2>
                <button type="button" onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xl leading-none">&times;</button>
            </div>

            <form id="settingsForm" onsubmit="saveSettings(event)" class="flex flex-col gap-4">
                <div>
                    <label for="telegramToken" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        Telegram Bot Token
                    </label>
                    <input type="text" id="telegramToken" placeholder="e.g. 123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
                           class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-900 dark:text-white rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label for="telegramChatId" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        Chat ID
                    </label>
                    <input type="text" id="telegramChatId" placeholder="e.g. 987654321"
                           class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-900 dark:text-white rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="flex justify-end gap-2 mt-2">
                    <button type="button" onclick="closeSettingsModal()" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-lg text-sm font-semibold transition-colors">
                        Cancel
                    </button>
                    <button type="submit" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg text-sm font-semibold transition-colors">
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm"></div>

    <script>
        // --- Threshold & Status Config ---
        const CPU_THRESHOLD = 85;
        const RAM_THRESHOLD = 90;
        const ONLINE_TIMEOUT_MS = 10000; // Mark server offline if no data for 10 seconds
        let lastAlertToastTime = 0;

        // --- Theme Toggle ---
        function updateThemeIcon(isDark) {
            const icon = document.getElementById('themeIcon');
            icon.innerHTML = isDark
                ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>'
                : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>';
        }

        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon(isDark);
            initCharts();
            fetchRealTimeData();
        }

        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            updateThemeIcon(true);
        }

        // --- Dynamic Online/Offline Status Badge ---
        function setOnlineStatus(isOnline) {
            const badge = document.getElementById('statusBadge');
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (isOnline) {
                badge.className = 'flex items-center gap-2 text-sm font-semibold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/30 px-3 py-1 rounded-full transition-colors';
                dot.className = 'w-2 h-2 rounded-full bg-emerald-500 dark:bg-emerald-400 animate-pulse';
                text.textContent = 'Online';
            } else {
                badge.className = 'flex items-center gap-2 text-sm font-semibold text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-700 px-3 py-1 rounded-full transition-colors';
                dot.className = 'w-2 h-2 rounded-full bg-slate-400 dark:bg-slate-500';
                text.textContent = 'Offline';
            }
        }

        // --- Chart Instances ---
        let lineChart, pieChart, barChart;
        let isDrillDown = false;
        let currentDrillDownServer = null;

        function initCharts() {
            if (lineChart) lineChart.dispose();
            if (pieChart) pieChart.dispose();
            if (barChart) barChart.dispose();

            const theme = document.documentElement.classList.contains('dark') ? 'dark' : null;
            const bgOpt = theme === 'dark' ? { backgroundColor: 'transparent' } : {};

            lineChart = echarts.init(document.getElementById('lineChart'), theme);
            pieChart = echarts.init(document.getElementById('pieChart'), theme);
            barChart = echarts.init(document.getElementById('barChart'), theme);

            lineChart.setOption({
                ...bgOpt,
                tooltip: { trigger: 'axis' },
                legend: { data: ['CPU', 'RAM'], bottom: 0 },
                grid: { left: '3%', right: '4%', bottom: '15%', containLabel: true },
                xAxis: { type: 'category', boundaryGap: false, data: [] },
                yAxis: { type: 'value', max: 100, name: 'Usage %' },
                series: [
                    { name: 'CPU', type: 'line', smooth: true, data: [], itemStyle: { color: '#ee6666' } },
                    { name: 'RAM', type: 'line', smooth: true, data: [], itemStyle: { color: '#5470c6' } }
                ]
            });

            pieChart.setOption({
                ...bgOpt,
                tooltip: { trigger: 'item', formatter: '{b}: {c}%' },
                legend: { bottom: '0%' },
                series: [{
                    type: 'pie',
                    radius: ['40%', '70%'],
                    avoidLabelOverlap: false,
                    itemStyle: { borderRadius: 10, borderColor: theme === 'dark' ? '#1e293b' : '#fff', borderWidth: 2 },
                    label: { show: false, position: 'center' },
                    emphasis: { label: { show: true, fontSize: 18, fontWeight: 'bold' } },
                    labelLine: { show: false },
                    data: []
                }]
            });

            if (isDrillDown && currentDrillDownServer) {
                renderLevel2(currentDrillDownServer);
            } else {
                renderLevel1(bgOpt);
            }

            barChart.on('click', function (params) {
                if (!isDrillDown) renderLevel2(params.name);
            });
        }

        // --- Global Alert Polling ---
        function fetchGlobalAlerts() {
            fetch('/api/alerts')
                .then(res => res.json())
                .then(alerts => {
                    const alertBanner = document.getElementById('alertBanner');
                    const alertMessage = document.getElementById('alertMessage');

                    if (alerts && alerts.length > 0) {
                        const summary = alerts
                            .map(a => `[${a.hostname}] ${a.reasons.join(', ')}`)
                            .join('  |  ');

                        alertMessage.textContent = summary;
                        alertBanner.classList.remove('hidden');

                        const now = Date.now();
                        if (now - lastAlertToastTime > 10000) {
                            showToast(summary, 'warning');
                            lastAlertToastTime = now;
                        }
                    } else {
                        alertBanner.classList.add('hidden');
                    }
                })
                .catch(err => console.error('API Error (/api/alerts):', err));
        }

        function onServerChange() {
            fetchRealTimeData();
        }

        function updateChartsWithMetrics(timestamps, cpuList, ramList, latestRam) {
            if (lineChart) {
                lineChart.setOption({
                    xAxis: { data: timestamps },
                    series: [{ data: cpuList }, { data: ramList }]
                });
            }

            const freeRam = Math.max(0, 100 - latestRam).toFixed(2);
            if (pieChart) {
                pieChart.setOption({
                    series: [{
                        data: [
                            { value: latestRam, name: 'Used RAM', itemStyle: { color: latestRam > RAM_THRESHOLD ? '#ef4444' : '#5470c6' } },
                            { value: parseFloat(freeRam), name: 'Free RAM', itemStyle: { color: '#91cc75' } }
                        ]
                    }]
                });
            }
        }

        // --- Real-Time Data Fetching & 10s Online Check ---
        function fetchRealTimeData() {
            const serverSelect = document.getElementById('serverSelect');
            if (!serverSelect || !serverSelect.value) {
                setOnlineStatus(false);
                return;
            }

            const serverId = serverSelect.value;

            fetch('/api/metrics?server_id=' + serverId)
                .then(res => res.json())
                .then(data => {
                    if (!data || data.length === 0) {
                        setOnlineStatus(false);
                        if (lineChart) {
                            lineChart.setOption({
                                xAxis: { data: [] },
                                series: [{ data: [] }, { data: [] }]
                            });
                        }
                        if (pieChart) {
                            pieChart.setOption({ series: [{ data: [] }] });
                        }
                        return;
                    }

                    // Check if the latest record is within the 10-second online window
                    const latestTime = new Date(data[0].timestamp.replace(' ', 'T')).getTime();
                    const isOnline = !isNaN(latestTime) && (Date.now() - latestTime) <= ONLINE_TIMEOUT_MS;
                    setOnlineStatus(isOnline);

                    const timestamps = data.map(i => i.timestamp.split(' ')[1]).reverse();
                    const cpuList = data.map(i => i.cpu_percent).reverse();
                    const ramList = data.map(i => i.memory_percent).reverse();

                    updateChartsWithMetrics(timestamps, cpuList, ramList, data[0].memory_percent);
                })
                .catch(err => {
                    setOnlineStatus(false);
                    console.error('API Error (/api/metrics):', err);
                });
        }

        // --- Bar Chart Drill-Down ---
        const backBtn = document.getElementById('backBtn');
        const drillDownTitle = document.getElementById('drillDownTitle');

        function renderLevel1(extraOpts = {}) {
            isDrillDown = false;
            currentDrillDownServer = null;
            backBtn.classList.add('hidden');
            drillDownTitle.textContent = 'Server CPU Load (Click a column to Drill-down)';

            const theme = document.documentElement.classList.contains('dark') ? 'dark' : null;
            const bgOpt = theme === 'dark' ? { backgroundColor: 'transparent' } : {};

            fetch('/api/servers/overview')
                .then(res => res.json())
                .then(data => {
                    if (barChart) {
                        barChart.setOption({
                            ...bgOpt,
                            ...extraOpts,
                            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                            grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                            xAxis: { type: 'category', data: data.map(i => i.hostname) },
                            yAxis: { type: 'value', max: 100, name: 'CPU %' },
                            series: [{
                                name: 'Total CPU Load',
                                type: 'bar',
                                barWidth: '40%',
                                data: data.map(i => ({
                                    value: i.cpu_percent,
                                    itemStyle: {
                                        color: i.cpu_percent > CPU_THRESHOLD ? '#ef4444' : '#6366f1',
                                        borderRadius: [4, 4, 0, 0]
                                    }
                                }))
                            }]
                        }, true);
                    }
                })
                .catch(err => console.error('API Error (/api/servers/overview):', err));
        }

        function renderLevel2(serverName) {
            isDrillDown = true;
            currentDrillDownServer = serverName;
            backBtn.classList.remove('hidden');
            drillDownTitle.textContent = `Top Processes for: ${serverName}`;

            const theme = document.documentElement.classList.contains('dark') ? 'dark' : null;
            const bgOpt = theme === 'dark' ? { backgroundColor: 'transparent' } : {};

            fetch('/api/processes?hostname=' + encodeURIComponent(serverName))
                .then(res => res.json())
                .then(data => {
                    if (barChart) {
                        barChart.setOption({
                            ...bgOpt,
                            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                            grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                            xAxis: { type: 'category', data: data.map(i => i.process_name) },
                            yAxis: { type: 'value', max: 100, name: 'Memory %' },
                            series: [{
                                name: 'Process RAM Load',
                                type: 'bar',
                                barWidth: '40%',
                                data: data.map(i => i.memory_percent),
                                itemStyle: { color: '#10b981', borderRadius: [4, 4, 0, 0] }
                            }]
                        }, true);
                    }
                    showToast(`Drilled down into ${serverName}`, 'info');
                })
                .catch(err => console.error('API Error (/api/processes):', err));
        }

        function goBackToLevel1() {
            renderLevel1();
        }

        // --- Settings Modal ---
        function openSettingsModal() {
            fetch('/api/settings')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('telegramToken').value = data.telegram_bot_token || '';
                    document.getElementById('telegramChatId').value = data.telegram_chat_id || '';
                    document.getElementById('settingsModal').classList.remove('hidden');
                })
                .catch(err => console.error('API Error (/api/settings):', err));
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings(event) {
            event.preventDefault();
            const payload = {
                telegram_bot_token: document.getElementById('telegramToken').value.trim(),
                telegram_chat_id: document.getElementById('telegramChatId').value.trim()
            };

            fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
                .then(res => {
                    if (!res.ok) throw new Error('Failed to save settings');
                    return res.json();
                })
                .then(() => {
                    closeSettingsModal();
                    showToast('Telegram settings saved', 'info');
                })
                .catch(err => {
                    console.error('API Error (/api/settings):', err);
                    showToast('Failed to save settings', 'warning');
                });
        }

        // --- Toast Notifications ---
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const isWarning = type === 'warning';

            toast.className = isWarning
                ? 'bg-red-600 text-white px-4 py-2.5 rounded-lg shadow-lg text-sm font-semibold flex items-center gap-2'
                : 'bg-slate-800 dark:bg-slate-200 text-white dark:text-slate-800 px-4 py-2.5 rounded-lg shadow-lg text-sm flex items-center gap-2';

            const iconSvg = isWarning
                ? '<svg class="w-4 h-4 text-white shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>'
                : '<svg class="w-4 h-4 text-emerald-400 dark:text-emerald-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';

            toast.innerHTML = `${iconSvg}<span>${message}</span>`;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        // --- Initialization ---
        window.onload = function () {
            initCharts();
            fetchRealTimeData();
            fetchGlobalAlerts();

            setInterval(() => {
                fetchRealTimeData();
                fetchGlobalAlerts();
                if (!isDrillDown) renderLevel1();
            }, 2000);
        };

        window.addEventListener('resize', () => {
            if (lineChart) lineChart.resize();
            if (pieChart) pieChart.resize();
            if (barChart) barChart.resize();
        });
    </script>
</body>
</html>
